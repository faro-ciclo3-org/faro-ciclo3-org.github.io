<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ciclo 3 · IA · límite de intentos</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main id="main">
    <h1>Ciclo 3 · IA · límite de intentos</h1>
    <img id="c3-ia-int" src="https://faro-ciclo3-org.github.io/img/taza.jpg">
    <script>
      // Igual que c3-ia-dyn-id: el id cambia en cada carga, así que la validación falla en cada
      // intento. Con MAX_PATCH_ATTEMPTS=1, el Issue tiene que mostrar un solo intento (CP-33-02).
      document.getElementById("c3-ia-int").id = "img-" + Math.random().toString(36).slice(2);
    </script>
  </main>
</body>
</html>
