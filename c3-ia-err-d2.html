<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ciclo 3 · IA · elegir el mensaje de error</title>
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main id="main">
    <h1>Ciclo 3 · IA · elegir el mensaje de error</h1>
    <form>
      <div>
        <label for="c3-ed2-monto">Monto a transferir</label>
        <input aria-describedby="c3-ed2-minimo" id="c3-ed2-monto" name="c3-ed2-monto" value="50" aria-invalid="true">
        <span id="c3-ed2-saldo">Tu saldo disponible es de $ 12.500.</span>
        <span id="c3-ed2-minimo">El monto mínimo por transferencia es de $ 100.</span>
      </div>
      <div>
        <label for="c3-ed2-correo">Correo electrónico</label>
        <input id="c3-ed2-correo" name="c3-ed2-correo" type="email" autocomplete="email" value="ana@ejemplo.com" aria-invalid="true">
        <span id="c3-ed2-envio">Te enviamos el comprobante a esta dirección.</span>
        <span id="c3-ed2-privacidad">Nunca compartimos tu correo con terceros.</span>
      </div>
    </form>
  </main>
</body>
</html>
